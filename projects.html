<main>
  <div class="page" style="max-width: 800px;">
    <h1 class="page-title">Projects</h1>

    <div class="projects-controls">
      <div class="projects-filter">
        <span class="filter-label">Filter:</span>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="data-visualization">Data Visualization</button>
        <button class="filter-btn" data-filter="data-engineering">Data Engineering</button>
      </div>
      <div class="projects-sort">
        <label class="sort-label" for="sort-select">Sort:</label>
        <select class="sort-select" id="sort-select">
          <option value="year">Newest first</option>
          <option value="name">Name (A–Z)</option>
        </select>
      </div>
    </div>

    <div class="projects-grid" id="projects-grid">
      <!-- rendered by JS -->
    </div>
  </div>
</main>

<script src="js/projects.js"></script>
<script src="js/main.js"></script>
<script>
  const tagLabels = {
    'data-visualization': 'Data Viz',
    'data-engineering':   'Data Engineering',
    'd3':                 'D3.js',
    'dbt':                'dbt',
    'maps':               'Maps',
    'python':             'Python',
    'snowflake':          'Snowflake'
  };

  function renderProjects() {
    const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
    const sortValue    = document.getElementById('sort-select').value;

    let filtered = projects.filter(p =>
      activeFilter === 'all' || p.tags.includes(activeFilter)
    );

    filtered.sort((a, b) =>
      sortValue === 'name' ? a.title.localeCompare(b.title) : b.year - a.year
    );

    const grid = document.getElementById('projects-grid');

    if (filtered.length === 0) {
      grid.innerHTML = '<p class="projects-empty">No projects found for this filter.</p>';
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="project-card">
        <div class="project-card-title">
          <a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>
        </div>
        <p class="project-card-desc">${p.description}</p>
        <div class="project-card-tags">
          ${p.tags.map(t => `<span class="project-tag">${tagLabels[t] || t}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProjects();
    });
  });

  document.getElementById('sort-select').addEventListener('change', renderProjects);

  renderProjects();
</script>
</body>
